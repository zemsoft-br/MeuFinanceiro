name: Dart Format Diagnostic

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - apps/app/lib/**
      - apps/app/test/**
      - .github/workflows/dart-format-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: dart-format-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-format:
    name: Apply pinned Dart formatter
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/demo-visual-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/demo-visual-identity
          fetch-depth: 0
          persist-credentials: true

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/meufinanceiro/flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.flutter-version', '.flutter-revision') }}

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(tr -d '[:space:]' < .flutter-version)"
          EXPECTED_REVISION="$(tr -d '[:space:]' < .flutter-revision)"
          FLUTTER_ROOT="$HOME/.cache/meufinanceiro/flutter/$EXPECTED_VERSION-$EXPECTED_REVISION"

          if [[ -x "$FLUTTER_ROOT/bin/flutter" ]]; then
            ACTUAL_REVISION="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
            if [[ "$ACTUAL_REVISION" != "$EXPECTED_REVISION" ]]; then
              rm -rf "$FLUTTER_ROOT"
            fi
          fi

          if [[ ! -x "$FLUTTER_ROOT/bin/flutter" ]]; then
            mkdir -p "$(dirname "$FLUTTER_ROOT")"
            git clone --depth 1 --branch "$EXPECTED_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi

          ACTUAL_REVISION="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          if [[ "$ACTUAL_REVISION" != "$EXPECTED_REVISION" ]]; then
            echo "Flutter revision mismatch after clone" >&2
            exit 1
          fi

          git config --global --add safe.directory "$FLUTTER_ROOT"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"

      - name: Apply formatter and publish generated changes
        shell: bash
        run: |
          set -euo pipefail
          dart format apps/app/lib apps/app/test

          if git diff --quiet -- apps/app/lib apps/app/test; then
            echo "Dart sources already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/app/lib apps/app/test
          git commit --signoff -m "style(dart): format accessibility fixes"
          git push origin HEAD:feature/demo-visual-identity
