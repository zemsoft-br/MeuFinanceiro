name: Container Quality

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - compose.yaml
      - '**/Dockerfile'
      - packages/security/**
      - packages/persistence/**
      - apps/api/pyproject.toml
      - apps/worker/pyproject.toml
      - apps/web/package.json
      - apps/web/package-lock.json
      - infra/caddy/**
      - infra/scripts/manage-secrets.py
      - tests/smoke/**
      - .github/workflows/container-quality.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  container-quality:
    name: Docker Compose integration
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Create disposable environment and keyring
        shell: bash
        run: |
          umask 077
          cat > .env <<EOF_ENV
          POSTGRES_DB=meufinanceiro_ci
          POSTGRES_USER=meufinanceiro_admin_ci
          POSTGRES_PASSWORD=$(openssl rand -hex 32)
          APP_DATABASE_USER=meufinanceiro_app_ci
          APP_DATABASE_PASSWORD=$(openssl rand -hex 32)
          APP_HTTP_PORT=8080
          APP_KEYRING_FILE_HOST=.secrets/keyring.json
          EOF_ENV
          python3 infra/scripts/manage-secrets.py init --path .secrets/keyring.json

      - name: Validate Compose contract
        run: docker compose config --quiet

      - name: Pull PostgreSQL image
        run: docker compose pull postgres

      - name: Build API image
        run: docker compose build --pull api

      - name: Build Worker image
        run: docker compose build --pull worker

      - name: Build Web image
        run: docker compose build --pull web

      - name: Build Caddy image
        run: docker compose build --pull caddy

      - name: Start healthy stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Run smoke test
        run: bash tests/smoke/compose-smoke.sh

      - name: Verify runtime role is unprivileged
        shell: bash
        run: |
          docker compose exec -T api python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              row = connection.execute(text(
                  "SELECT current_user AS name, rolsuper, rolcreatedb, rolcreaterole, "
                  "rolreplication, rolbypassrls FROM pg_roles WHERE rolname = current_user"
              )).mappings().one()
          assert not row["rolsuper"]
          assert not row["rolcreatedb"]
          assert not row["rolcreaterole"]
          assert not row["rolreplication"]
          assert not row["rolbypassrls"]
          with engine.connect() as connection:
              can_create = connection.scalar(text(
                  "SELECT has_schema_privilege(current_user, 'infra', 'CREATE')"
              ))
          assert can_create is False
          print(f"runtime role validated: {row['name']}")
          PY

      - name: Validate restart
        shell: bash
        run: |
          docker compose restart postgres api worker web caddy
          docker compose up --detach --wait --wait-timeout 120
          bash tests/smoke/compose-smoke.sh

      - name: Capture diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200

      - name: Stop stack gracefully
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 40
