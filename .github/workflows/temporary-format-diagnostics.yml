name: Temporary Finalize Diagnostics

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize
    paths:
      - .github/workflows/temporary-format-diagnostics.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply final corrections
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check ruff==0.15.22
          python - <<'PY'
          from pathlib import Path

          shell_path = Path("infra/scripts/diagnostics-export.sh")
          shell = shell_path.read_text(encoding="utf-8")
          old_shell = '    re.compile(r"(?i)postgres(?:ql)?://[^\\s/]+@"),'
          new_shell = '    re.compile(r"(?i)postgres(?:ql)?://(?!\\[REDACTED\\]@)[^\\s/]+@"),'
          if shell.count(old_shell) != 1:
              raise SystemExit("scanner Unix esperado não encontrado exatamente uma vez")
          shell_path.write_text(shell.replace(old_shell, new_shell), encoding="utf-8")

          ps_path = Path("infra/scripts/diagnostics-export.ps1")
          powershell = ps_path.read_text(encoding="utf-8")
          old_ps = '        Write-SanitizedFile (Join-Path $StagingDirectory "compose-ps.json") ($selected | ConvertTo-Json -Depth 6)'
          new_ps = '''        $composePsJson = if ($selected.Count -eq 0) {
              "[]"
          }
          else {
              $selected | ConvertTo-Json -Depth 6
          }
          Write-SanitizedFile (Join-Path $StagingDirectory "compose-ps.json") $composePsJson'''
          if powershell.count(old_ps) != 1:
              raise SystemExit("serialização PowerShell esperada não encontrada exatamente uma vez")
          ps_path.write_text(powershell.replace(old_ps, new_ps), encoding="utf-8")
          PY
          python -m ruff format tests/quality/test_diagnostics_contract.py
          rm .github/workflows/temporary-format-diagnostics.yml
      - name: Publish final branch state
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "Vinicius Eduardo Dezem"
          git config user.email "291430811+zemsoft-br@users.noreply.github.com"
          git add \
            infra/scripts/diagnostics-export.sh \
            infra/scripts/diagnostics-export.ps1 \
            tests/quality/test_diagnostics_contract.py \
            .github/workflows/temporary-format-diagnostics.yml
          git commit -s -m "fix(diagnostics): finalize sanitization contracts"
          git push origin "HEAD:$HEAD_BRANCH"
