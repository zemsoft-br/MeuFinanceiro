name: Temporary Ruff Diff

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize
      - opened
      - reopened

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.22
      - name: Print exact Ruff formatting diff
        run: >-
          python -m ruff format --diff
          packages/banking-pluggy/src/meufinanceiro_banking_pluggy/http_gateway.py
          packages/banking-pluggy/tests/test_http_gateway.py
