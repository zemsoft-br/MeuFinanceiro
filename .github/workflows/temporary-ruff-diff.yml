name: Temporary Ruff Apply

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.22
      - name: Apply formatting and typing correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "packages/banking-pluggy/src/"
              "meufinanceiro_banking_pluggy/http_gateway.py"
          )
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from typing import Protocol, TypeAlias, cast, runtime_checkable",
              "from typing import NoReturn, Protocol, TypeAlias, cast, runtime_checkable",
          )
          text = text.replace(
              "def _raise_transport_error(error: PluggyTransportError) -> None:",
              "def _raise_transport_error(error: PluggyTransportError) -> NoReturn:",
          )
          text = text.replace(
              "def _raise_payload_error(error: _PayloadError) -> None:",
              "def _raise_payload_error(error: _PayloadError) -> NoReturn:",
          )
          path.write_text(text, encoding="utf-8")
          PY
          python -m ruff format \
            packages/banking-pluggy/src/meufinanceiro_banking_pluggy/http_gateway.py \
            packages/banking-pluggy/tests/test_http_gateway.py
          rm .github/workflows/temporary-ruff-diff.yml
      - name: Commit formatted files
        shell: bash
        run: |
          git config user.name "zemsoft-br"
          git config user.email "291430811+zemsoft-br@users.noreply.github.com"
          git add \
            packages/banking-pluggy/src/meufinanceiro_banking_pluggy/http_gateway.py \
            packages/banking-pluggy/tests/test_http_gateway.py \
            .github/workflows/temporary-ruff-diff.yml
          if ! git diff --cached --quiet; then
            git commit -s -m "style(banking): format Pluggy HTTP gateway"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
