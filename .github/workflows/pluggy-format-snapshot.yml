name: Pluggy Format Snapshot

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize
    paths:
      - tools/pluggy-spike/pluggy_spike.py
      - tests/quality/test_pluggy_spike_contract.py
      - infra/scripts/run-quality.py
      - .github/workflows/pluggy-format-snapshot.yml

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.22

      - name: Format Pluggy spike files
        run: >-
          python -m ruff format
          tools/pluggy-spike/pluggy_spike.py
          tests/quality/test_pluggy_spike_contract.py
          infra/scripts/run-quality.py

      - name: Commit formatted files and remove temporary workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/pluggy-format-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/pluggy-spike/pluggy_spike.py \
            tests/quality/test_pluggy_spike_contract.py \
            infra/scripts/run-quality.py \
            .github/workflows/pluggy-format-snapshot.yml
          git commit --signoff -m 'style(pluggy): apply exact Ruff formatting'
          git push origin "HEAD:$HEAD_BRANCH"
