name: Pluggy Format Snapshot

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize
    paths:
      - tools/pluggy-spike/pluggy_spike.py
      - tests/quality/test_pluggy_spike_contract.py
      - infra/scripts/run-quality.py
      - .github/workflows/pluggy-format-snapshot.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install exact Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.22

      - name: Format Pluggy spike files
        run: >-
          python -m ruff format
          tools/pluggy-spike/pluggy_spike.py
          tests/quality/test_pluggy_spike_contract.py
          infra/scripts/run-quality.py

      - name: Upload formatted snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pluggy-formatted-${{ github.run_id }}
          path: |
            tools/pluggy-spike/pluggy_spike.py
            tests/quality/test_pluggy_spike_contract.py
            infra/scripts/run-quality.py
          if-no-files-found: error
          retention-days: 1
