name: Quality Mypy Fix

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: quality-mypy-fix-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-fix:
    if: github.event.pull_request.number == 69
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply type-safe statement names
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/persistence/src/meufinanceiro_persistence/banking_store.py")
          content = path.read_text(encoding="utf-8")
          first = "                statement = postgresql_insert(connections).values(\n"
          second = "                statement = statement.on_conflict_do_update(\n"
          if content.count(first) != 1 or content.count(second) != 1:
              raise SystemExit("expected banking statement pattern was not found exactly once")
          content = content.replace(
              first,
              "                insert_statement = postgresql_insert(connections).values(\n",
              1,
          )
          content = content.replace(
              second,
              "                statement = insert_statement.on_conflict_do_update(\n",
              1,
          )
          path.write_text(content, encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check ruff==0.15.22
          python -m ruff format packages/persistence/src/meufinanceiro_persistence/banking_store.py

      - name: Commit correction
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add packages/persistence/src/meufinanceiro_persistence/banking_store.py
          if git diff --cached --quiet; then
            echo "Mypy correction already committed."
            exit 0
          fi
          git config user.name "zemsoft-br"
          git config user.email "291430811+zemsoft-br@users.noreply.github.com"
          git commit -s -m "fix(banking): separate PostgreSQL statement types"
          git push origin "HEAD:${HEAD_BRANCH}"
