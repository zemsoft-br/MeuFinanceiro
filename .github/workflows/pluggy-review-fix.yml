name: Pluggy Review Fix

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: pluggy-review-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fix-and-validate:
    if: github.event.pull_request.head.ref == 'feature/pluggy-readonly-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply review correction
        run: |
          python - <<'PY'
          from pathlib import Path

          adapter_path = Path(
              "packages/banking-pluggy/src/meufinanceiro_banking_pluggy/adapter.py"
          )
          adapter = adapter_path.read_text(encoding="utf-8")
          adapter = adapter.replace(
              "from datetime import datetime",
              "from datetime import date, datetime",
          )
          adapter = adapter.replace(
              '''        item = self._call_gateway(lambda: self._gateway.get_item(item_id))
          if item.item_id != item_id:
              self._invalid_snapshot()
          return self._normalize(lambda: self._map_item(item))''',
              '''        item = self._call_gateway(lambda: self._gateway.get_item(item_id))
          return self._normalize(
              lambda: self._validate_and_map_item(item_id, item)
          )''',
          )
          adapter = adapter.replace(
              '''        snapshots = self._call_gateway(lambda: self._gateway.list_accounts(item_id))
          if any(snapshot.item_id != item_id for snapshot in snapshots):
              self._invalid_snapshot()
          return self._normalize(
              lambda: tuple(self._map_account(snapshot) for snapshot in snapshots)
          )''',
              '''        snapshots = self._call_gateway(lambda: self._gateway.list_accounts(item_id))
          return self._normalize(
              lambda: self._validate_and_map_accounts(item_id, snapshots)
          )''',
          )
          adapter = adapter.replace(
              '''        if any(record.account_id != account_id for record in snapshot.records):
              self._invalid_snapshot()
          return self._normalize(lambda: self._map_transaction_page(snapshot))''',
              '''        return self._normalize(
              lambda: self._validate_and_map_transaction_page(account_id, snapshot)
          )''',
          )
          marker = "    @staticmethod\n    def _map_item(item: PluggyItemSnapshot) -> ConnectionState:\n"
          helpers = '''    @staticmethod
          def _validate_and_map_item(item_id: str, value: object) -> ConnectionState:
              if not isinstance(value, PluggyItemSnapshot):
                  PluggyBankingProvider._invalid_snapshot()
              if value.item_id != item_id or not isinstance(value.capabilities, tuple):
                  PluggyBankingProvider._invalid_snapshot()
              if any(
                  not isinstance(snapshot, PluggyCapabilitySnapshot)
                  for snapshot in value.capabilities
              ):
                  PluggyBankingProvider._invalid_snapshot()
              return PluggyBankingProvider._map_item(value)

          @staticmethod
          def _validate_and_map_accounts(
              item_id: str,
              value: object,
          ) -> tuple[ExternalAccount, ...]:
              if not isinstance(value, tuple):
                  PluggyBankingProvider._invalid_snapshot()
              mapped: list[ExternalAccount] = []
              account_ids: set[str] = set()
              for snapshot in value:
                  if not isinstance(snapshot, PluggyAccountSnapshot):
                      PluggyBankingProvider._invalid_snapshot()
                  if snapshot.item_id != item_id or snapshot.account_id in account_ids:
                      PluggyBankingProvider._invalid_snapshot()
                  account_ids.add(snapshot.account_id)
                  mapped.append(PluggyBankingProvider._map_account(snapshot))
              return tuple(mapped)

          @staticmethod
          def _validate_and_map_transaction_page(
              account_id: str,
              value: object,
          ) -> ExternalPage[ExternalTransaction]:
              if not isinstance(value, PluggyTransactionPageSnapshot):
                  PluggyBankingProvider._invalid_snapshot()
              if not isinstance(value.records, tuple):
                  PluggyBankingProvider._invalid_snapshot()
              for record in value.records:
                  if not isinstance(record, PluggyTransactionSnapshot):
                      PluggyBankingProvider._invalid_snapshot()
                  if record.account_id != account_id:
                      PluggyBankingProvider._invalid_snapshot()
                  if not isinstance(record.effective_date, date) or isinstance(
                      record.effective_date,
                      datetime,
                  ):
                      PluggyBankingProvider._invalid_snapshot()
              return PluggyBankingProvider._map_transaction_page(value)

          '''
          if helpers not in adapter:
              adapter = adapter.replace(marker, helpers + marker)

          old_error_block = '''    @staticmethod
          def _call_gateway(operation: Callable[[], Result]) -> Result:
              try:
                  return operation()
              except PluggyGatewayError as error:
                  raise BankingProviderError(
                      _GATEWAY_ERROR_TO_PROVIDER[error.category],
                      retryable=error.retryable,
                      provider_reason_code=error.provider_reason_code,
                      safe_message="provider read operation failed",
                  ) from None
              except Exception:
                  raise BankingProviderError(
                      ProviderErrorCategory.INTERNAL,
                      retryable=False,
                      safe_message="provider gateway failed",
                  ) from None

          @staticmethod
          def _normalize(operation: Callable[[], Result]) -> Result:
              try:
                  return operation()
              except (KeyError, TypeError, ValueError):
                  PluggyBankingProvider._invalid_snapshot()
          '''
          new_error_block = '''    @staticmethod
          def _call_gateway(operation: Callable[[], Result]) -> Result:
              try:
                  return operation()
              except PluggyGatewayError as error:
                  PluggyBankingProvider._raise_gateway_error(error)
              except Exception:
                  raise BankingProviderError(
                      ProviderErrorCategory.INTERNAL,
                      retryable=False,
                      safe_message="provider gateway failed",
                  ) from None

          @staticmethod
          def _raise_gateway_error(error: PluggyGatewayError) -> NoReturn:
              try:
                  if not isinstance(error.retryable, bool):
                      raise TypeError("retryable must be bool")
                  provider_error = BankingProviderError(
                      _GATEWAY_ERROR_TO_PROVIDER[error.category],
                      retryable=error.retryable,
                      provider_reason_code=error.provider_reason_code,
                      safe_message="provider read operation failed",
                  )
              except (AttributeError, KeyError, TypeError, ValueError):
                  raise BankingProviderError(
                      ProviderErrorCategory.INTERNAL,
                      retryable=False,
                      safe_message="provider gateway failed",
                  ) from None
              raise provider_error from None

          @staticmethod
          def _normalize(operation: Callable[[], Result]) -> Result:
              try:
                  return operation()
              except BankingProviderError:
                  raise
              except Exception:
                  PluggyBankingProvider._invalid_snapshot()
          '''
          adapter = adapter.replace(old_error_block, new_error_block)
          adapter_path.write_text(adapter, encoding="utf-8")

          tests_path = Path("packages/banking-pluggy/tests/test_adapter.py")
          tests = tests_path.read_text(encoding="utf-8")
          test_marker = "def test_malformed_gateway_return_types_are_sanitized"
          if test_marker not in tests:
              tests += '''

          @pytest.mark.parametrize(
              "operation",
              ["connection", "accounts", "transactions"],
          )
          def test_malformed_gateway_return_types_are_sanitized(operation: str) -> None:
              gateway = GatewayStub()
              provider = PluggyBankingProvider(gateway)

              if operation == "connection":
                  gateway.item = object()  # type: ignore[assignment]

                  def invocation() -> object:
                      return provider.get_connection("item-001")

              elif operation == "accounts":
                  gateway.accounts = (object(),)  # type: ignore[assignment]

                  def invocation() -> object:
                      return provider.list_accounts("item-001")

              else:
                  gateway.page = object()  # type: ignore[assignment]

                  def invocation() -> object:
                      return provider.list_transactions("account-bank", None, None)

              with pytest.raises(BankingProviderError) as captured:
                  invocation()

              assert captured.value.category is ProviderErrorCategory.INTERNAL
              assert str(captured.value) == "provider snapshot could not be normalized"
              assert captured.value.__cause__ is None


          def test_invalid_effective_date_snapshot_is_rejected() -> None:
              gateway = GatewayStub()
              gateway.page = PluggyTransactionPageSnapshot(
                  records=(
                      PluggyTransactionSnapshot(
                          account_id="account-bank",
                          transaction_id="transaction-invalid-date",
                          state=PluggyTransactionState.POSTED,
                          effective_date="2026-07-20",  # type: ignore[arg-type]
                          amount=Decimal("1.00"),
                          currency="BRL",
                      ),
                  ),
                  next_cursor=None,
                  source_window="synthetic-window-invalid-date",
                  retrieved_at=NOW,
              )
              provider = PluggyBankingProvider(gateway)

              with pytest.raises(BankingProviderError) as captured:
                  provider.list_transactions("account-bank", None, None)

              assert captured.value.category is ProviderErrorCategory.INTERNAL
              assert str(captured.value) == "provider snapshot could not be normalized"
              assert captured.value.__cause__ is None


          def test_malformed_gateway_error_is_sanitized() -> None:
              gateway = GatewayStub()
              error = PluggyGatewayError(
                  PluggyGatewayErrorCategory.INTERNAL,
                  retryable=False,
              )
              error.category = "sensitive-category"  # type: ignore[assignment]
              error.retryable = "yes"  # type: ignore[assignment]
              gateway.error = error
              provider = PluggyBankingProvider(gateway)

              with pytest.raises(BankingProviderError) as captured:
                  provider.get_connection("item-001")

              assert captured.value.category is ProviderErrorCategory.INTERNAL
              assert str(captured.value) == "provider gateway failed"
              assert "sensitive-category" not in str(captured.value)
              assert captured.value.__cause__ is None
          '''
          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install validation environment
        run: |
          python -m pip install --disable-pip-version-check \
            ruff==0.15.22 \
            mypy==2.3.0 \
            -e './packages/banking[test]' \
            -e './packages/banking-pluggy[test]'

      - name: Format and validate
        run: |
          python -m ruff format packages/banking-pluggy
          python -m ruff check packages/banking-pluggy
          python -m mypy --strict packages/banking/src packages/banking-pluggy/src
          python -m pytest packages/banking-pluggy/tests

      - name: Commit correction when needed
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add \
            packages/banking-pluggy/src/meufinanceiro_banking_pluggy/adapter.py \
            packages/banking-pluggy/tests/test_adapter.py
          if ! git diff --cached --quiet; then
            git config user.name "zemsoft-br"
            git config user.email "291430811+zemsoft-br@users.noreply.github.com"
            git commit -s -m "fix(banking): sanitize malformed Pluggy snapshots"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
