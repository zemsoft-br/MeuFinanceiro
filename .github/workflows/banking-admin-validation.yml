name: Banking Admin Validation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: banking-admin-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feature/banking-admin-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install validation environment
        run: |
          python -m pip install --disable-pip-version-check \
            ruff==0.15.22 \
            mypy==2.3.0 \
            -e './packages/banking[test]' \
            -e './packages/security[test]' \
            -e './packages/persistence[test]' \
            -e './apps/api[test]'

      - name: Apply exact Ruff formatting
        run: |
          python -m ruff format \
            packages/banking/src/meufinanceiro_banking/__init__.py \
            packages/banking/src/meufinanceiro_banking/registry.py \
            packages/banking/tests/test_registry.py \
            apps/api/app/core/config.py \
            apps/api/app/main.py \
            apps/api/app/services \
            apps/api/tests/test_banking_admin.py \
            apps/api/tests/test_banking_runtime.py \
            tests/quality/test_banking_admin_registry_contract.py

      - name: Commit formatting when needed
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add \
            packages/banking/src/meufinanceiro_banking/__init__.py \
            packages/banking/src/meufinanceiro_banking/registry.py \
            packages/banking/tests/test_registry.py \
            apps/api/app/core/config.py \
            apps/api/app/main.py \
            apps/api/app/services \
            apps/api/tests/test_banking_admin.py \
            apps/api/tests/test_banking_runtime.py \
            tests/quality/test_banking_admin_registry_contract.py
          if ! git diff --cached --quiet; then
            git config user.name "zemsoft-br"
            git config user.email "291430811+zemsoft-br@users.noreply.github.com"
            git commit -s -m "style(banking): apply Ruff formatting"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Lint selected scope
        run: >-
          python -m ruff check
          packages/banking/src packages/banking/tests
          apps/api/app apps/api/tests
          tests/quality/test_banking_admin_registry_contract.py

      - name: Type-check application sources
        run: >-
          python -m mypy --strict
          packages/banking/src packages/security/src packages/persistence/src
          apps/api/app

      - name: Test selected scope
        run: >-
          python -m pytest
          packages/banking/tests apps/api/tests
          tests/quality/test_banking_admin_registry_contract.py
