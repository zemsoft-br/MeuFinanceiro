name: Safe Update Quality

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - compose.yaml
      - infra/scripts/update-foundation.sh
      - infra/scripts/update-foundation.ps1
      - infra/scripts/backup-create.sh
      - infra/scripts/backup-create.ps1
      - infra/scripts/backup-verify.sh
      - infra/scripts/backup-verify.ps1
      - tests/smoke/**
      - tests/quality/test_safe_update_contract.py
      - .github/workflows/safe-update-quality.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-update-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  safe-update-quality:
    name: Source update and rollback integration
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 95

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create disposable configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          demo_secret="update-demo-$(openssl rand -hex 24)"
          echo "::add-mask::$demo_secret"
          cat > .env <<EOF_ENV
          POSTGRES_DB=meufinanceiro_update_ci
          POSTGRES_USER=meufinanceiro_admin_update_ci
          POSTGRES_PASSWORD=$(openssl rand -hex 32)
          APP_DATABASE_USER=meufinanceiro_app_update_ci
          APP_DATABASE_PASSWORD=$(openssl rand -hex 32)
          APP_HTTP_PORT=8080
          COMPOSE_PROJECT_NAME=meufinanceiro-update-ci
          APP_KEYRING_FILE_HOST=.secrets/keyring.json
          DEMO_OPERATOR_PASSWORD=$demo_secret
          EOF_ENV
          python3 infra/scripts/manage-secrets.py init --path .secrets/keyring.json

      - name: Prepare source installation
        shell: bash
        env:
          UPDATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/meufinanceiro-update-source"
          rm -rf "$source_root"
          git worktree add --detach "$source_root" "$UPDATE_BASE_SHA"
          cp .env "$source_root/.env"
          mkdir -p "$source_root/.secrets"
          cp .secrets/keyring.json "$source_root/.secrets/keyring.json"
          APP_KEYRING_FILE_HOST="$source_root/.secrets/keyring.json" docker compose \
            --project-directory "$source_root" \
            --env-file "$source_root/.env" \
            -f "$source_root/compose.yaml" \
            up --build --detach --wait --wait-timeout 180
          APP_HTTP_PORT=8080 bash "$source_root/tests/smoke/compose-smoke.sh"

      - name: Validate safe source update
        id: safe_update
        shell: bash
        env:
          UPDATE_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/meufinanceiro-update-source"
          backup_root="$RUNNER_TEMP/meufinanceiro-update-backups"
          env_hash_before="$(sha256sum "$source_root/.env" | awk '{print $1}')"
          keyring_hash_before="$(sha256sum "$source_root/.secrets/keyring.json" | awk '{print $1}')"
          volume_before="$(docker volume inspect meufinanceiro-update-ci_postgres_data --format '{{.Name}}|{{.Mountpoint}}|{{.CreatedAt}}')"

          state_path="$(bash infra/scripts/update-foundation.sh \
            --root-dir "$source_root" \
            --target-ref "$UPDATE_TARGET_SHA" \
            --backup-dir "$backup_root" \
            --acknowledge-sensitive \
            --no-fetch --allow-detached --skip-checkout-advance)"
          python3 - "$state_path" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              state = json.load(handle)
          assert state["status"] == "APPLIED", state
          assert state["detail"] == "target_started_and_smoke_passed", state
          assert state["backup_id"], state
          PY
          test "$(sha256sum "$source_root/.env" | awk '{print $1}')" = "$env_hash_before"
          test "$(sha256sum "$source_root/.secrets/keyring.json" | awk '{print $1}')" = "$keyring_hash_before"
          test "$(docker volume inspect meufinanceiro-update-ci_postgres_data --format '{{.Name}}|{{.Mountpoint}}|{{.CreatedAt}}')" = "$volume_before"
          APP_HTTP_PORT=8080 bash tests/smoke/compose-smoke.sh

      - name: Validate idempotent target
        shell: bash
        env:
          UPDATE_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          state_path="$(bash infra/scripts/update-foundation.sh \
            --root-dir "$PWD" \
            --target-ref "$UPDATE_TARGET_SHA" \
            --backup-dir "$RUNNER_TEMP/meufinanceiro-update-idempotent-backups" \
            --acknowledge-sensitive \
            --no-fetch --allow-detached --skip-checkout-advance)"
          python3 - "$state_path" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              state = json.load(handle)
          assert state["status"] == "APPLIED", state
          assert state["detail"] == "target_already_applied", state
          assert state["backup_id"] is None, state
          PY

      - name: Validate rollback with unchanged schema
        shell: bash
        env:
          UPDATE_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/meufinanceiro-update-source"
          backup_root="$RUNNER_TEMP/meufinanceiro-update-backups"
          set +e
          MEUFINANCEIRO_UPDATE_TEST_FAIL_AFTER_START=1 \
            bash infra/scripts/update-foundation.sh \
              --root-dir "$source_root" \
              --target-ref "$UPDATE_TARGET_SHA" \
              --backup-dir "$backup_root" \
              --acknowledge-sensitive \
              --no-fetch --allow-detached --skip-checkout-advance
          result=$?
          set -e
          test "$result" -eq 2
          state_path="$(find "$source_root/.updates" -mindepth 2 -maxdepth 2 \
            -name state.json -type f -printf '%T@ %p\n' \
            | sort -nr | head -n1 | cut -d' ' -f2-)"
          python3 - "$state_path" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              state = json.load(handle)
          assert state["status"] == "ROLLED_BACK", state
          assert state["detail"] == "target_failed_schema_unchanged", state
          PY
          APP_HTTP_PORT=8080 bash "$source_root/tests/smoke/compose-smoke.sh"

      - name: Validate schema-change rollback block
        shell: bash
        env:
          UPDATE_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/meufinanceiro-update-source"
          backup_root="$RUNNER_TEMP/meufinanceiro-update-backups"
          volume_before="$(docker volume inspect meufinanceiro-update-ci_postgres_data --format '{{.Name}}|{{.Mountpoint}}|{{.CreatedAt}}')"
          set +e
          MEUFINANCEIRO_UPDATE_TEST_FAIL_AFTER_START=1 \
          MEUFINANCEIRO_UPDATE_TEST_SCHEMA_OVERRIDE_AFTER_FAILURE=synthetic_changed_revision \
            bash infra/scripts/update-foundation.sh \
              --root-dir "$source_root" \
              --target-ref "$UPDATE_TARGET_SHA" \
              --backup-dir "$backup_root" \
              --acknowledge-sensitive \
              --no-fetch --allow-detached --skip-checkout-advance
          result=$?
          set -e
          test "$result" -eq 3
          state_path="$(find "$source_root/.updates" -mindepth 2 -maxdepth 2 \
            -name state.json -type f -printf '%T@ %p\n' \
            | sort -nr | head -n1 | cut -d' ' -f2-)"
          python3 - "$state_path" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              state = json.load(handle)
          assert state["status"] == "ROLLBACK_REQUIRES_COORDINATED_RESTORE", state
          assert state["detail"] == "schema_changed_or_unknown", state
          PY
          test "$(docker volume inspect meufinanceiro-update-ci_postgres_data --format '{{.Name}}|{{.Mountpoint}}|{{.CreatedAt}}')" = "$volume_before"
          test ! -d "$source_root/.updates/update.lock"

      - name: Restore target stack and validate cleanup
        shell: bash
        run: |
          set -euo pipefail
          APP_KEYRING_FILE_HOST="$PWD/.secrets/keyring.json" docker compose up \
            --build --detach --wait --wait-timeout 180
          APP_HTTP_PORT=8080 bash tests/smoke/compose-smoke.sh
          if git worktree list --porcelain \
            | grep -Eq 'meufinanceiro-update-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$'; then
            echo "Worktree temporário de update permaneceu após cleanup." >&2
            exit 1
          fi
          if docker ps --all --quiet --filter name=meufinanceiro-backup-verify- | grep -q .; then
            echo "Container temporário de restore permaneceu após cleanup." >&2
            exit 1
          fi

      - name: Stop disposable installation
        if: always()
        shell: bash
        run: |
          docker ps --all --quiet --filter name=meufinanceiro-backup-verify- \
            | xargs --no-run-if-empty docker rm --force || true
          git worktree remove --force \
            "$RUNNER_TEMP/meufinanceiro-update-source" >/dev/null 2>&1 || true
          rm -rf \
            "$RUNNER_TEMP/meufinanceiro-update-source" \
            "$RUNNER_TEMP/meufinanceiro-update-backups" \
            "$RUNNER_TEMP/meufinanceiro-update-idempotent-backups"
          docker compose down --volumes --remove-orphans --timeout 40 || true
