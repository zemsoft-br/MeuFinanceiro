name: Temporary Primary Residence Format Windows

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.22
      - name: Format primary residence files
        run: >-
          python -m ruff format
          apps/api/tests/test_auth_routes.py
          packages/persistence/src/meufinanceiro_persistence/identity_models.py
          packages/persistence/src/meufinanceiro_persistence/migrations/versions/0005_household_residences.py
      - name: Commit formatting
        shell: pwsh
        run: |
          git config user.name "zemsoft-br"
          git config user.email "291430811+zemsoft-br@users.noreply.github.com"
          git add `
            apps/api/tests/test_auth_routes.py `
            packages/persistence/src/meufinanceiro_persistence/identity_models.py `
            packages/persistence/src/meufinanceiro_persistence/migrations/versions/0005_household_residences.py
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -s -m "style(household): format primary residence files"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          }
