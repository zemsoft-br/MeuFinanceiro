name: Pluggy Read-only Adapter Validation

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize

permissions:
  contents: write

concurrency:
  group: pluggy-readonly-adapter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feature/pluggy-readonly-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install validation environment
        run: |
          python -m pip install --disable-pip-version-check \
            ruff==0.15.22 \
            mypy==2.3.0 \
            -e './packages/banking[test]' \
            -e './packages/banking-pluggy[test]'

      - name: Apply exact Ruff formatting
        run: |
          python -m ruff format \
            packages/banking-pluggy \
            tests/quality/test_pluggy_readonly_adapter_contract.py \
            infra/scripts/run-quality.py

      - name: Commit formatting when needed
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add \
            packages/banking-pluggy \
            tests/quality/test_pluggy_readonly_adapter_contract.py \
            infra/scripts/run-quality.py
          if ! git diff --cached --quiet; then
            git config user.name "zemsoft-br"
            git config user.email "291430811+zemsoft-br@users.noreply.github.com"
            git commit -s -m "style(banking): apply Ruff formatting"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi

      - name: Lint selected scope
        run: >-
          python -m ruff check
          packages/banking-pluggy
          tests/quality/test_pluggy_readonly_adapter_contract.py
          infra/scripts/run-quality.py

      - name: Type-check adapter sources
        run: >-
          python -m mypy --strict
          packages/banking/src
          packages/banking-pluggy/src

      - name: Test selected scope
        run: >-
          python -m pytest
          packages/banking-pluggy/tests
          tests/quality/test_pluggy_readonly_adapter_contract.py
          tests/quality/test_run_quality.py
