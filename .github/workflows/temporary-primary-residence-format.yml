name: Temporary Primary Residence Format

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.22
      - name: Format primary residence files
        run: >-
          python -m ruff format
          apps/api/app/api/auth.py
          apps/api/app/operator_cli.py
          packages/persistence/src/meufinanceiro_persistence/identity_store.py
          packages/persistence/tests/test_identity_store.py
          tests/quality/test_primary_residence_context_contract.py
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "zemsoft-br"
          git config user.email "291430811+zemsoft-br@users.noreply.github.com"
          git add \
            apps/api/app/api/auth.py \
            apps/api/app/operator_cli.py \
            packages/persistence/src/meufinanceiro_persistence/identity_store.py \
            packages/persistence/tests/test_identity_store.py \
            tests/quality/test_primary_residence_context_contract.py
          if ! git diff --cached --quiet; then
            git commit -s -m "style(household): format primary residence context"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
