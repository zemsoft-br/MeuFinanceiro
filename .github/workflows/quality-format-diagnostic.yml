name: Quality Format Diagnostic

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: quality-format-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-diagnostic:
    if: github.event.pull_request.number == 69
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.22

      - name: Format banking persistence files
        run: |
          python -m ruff format \
            packages/persistence/src/meufinanceiro_persistence/banking_store.py \
            packages/persistence/src/meufinanceiro_persistence/migrations/versions/0003_banking_persistence.py \
            packages/persistence/tests/conftest.py \
            packages/persistence/tests/test_banking_persistence.py \
            packages/persistence/tests/test_banking_persistence_errors.py

      - name: Commit exact Ruff output
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git add \
            packages/persistence/src/meufinanceiro_persistence/banking_store.py \
            packages/persistence/src/meufinanceiro_persistence/migrations/versions/0003_banking_persistence.py \
            packages/persistence/tests/conftest.py \
            packages/persistence/tests/test_banking_persistence.py \
            packages/persistence/tests/test_banking_persistence_errors.py
          if git diff --cached --quiet; then
            echo "Ruff output already committed."
            exit 0
          fi
          git config user.name "zemsoft-br"
          git config user.email "291430811+zemsoft-br@users.noreply.github.com"
          git commit -s -m "style(banking): apply Ruff formatting"
          git push origin "HEAD:${HEAD_BRANCH}"
