name: Temporary Fix Update Volume

on:
  pull_request:
    branches:
      - develop
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Discover PostgreSQL volume from the running container
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shell_path = Path("infra/scripts/update-foundation.sh")
          lines = shell_path.read_text(encoding="utf-8").splitlines()

          start = lines.index("volume_description=$(docker volume inspect meufinanceiro_postgres_data \\")
          end = next(
              i for i in range(start, len(lines))
              if lines[i].startswith("VOLUME_FINGERPRINT=")
          )
          del lines[start : end + 1]

          compose_end = lines.index("}", lines.index("compose_for() {"))
          dynamic_block = [
              "",
              "get_volume_description() {",
              "  local project_dir=$1",
              "  local postgres_container volume_name",
              "  postgres_container=$(compose_for \"$project_dir\" ps -q postgres \\",
              "    | awk 'NF {gsub(/^[[:space:]]+|[[:space:]]+$/, \"\"); print}' \\",
              "    | tail -n 1)",
              "  [[ -n \"$postgres_container\" ]] || return 1",
              "  volume_name=$(docker inspect --format \\",
              "    '{{range .Mounts}}{{if eq .Destination \"/var/lib/postgresql/data\"}}{{.Name}}{{end}}{{end}}' \\",
              "    \"$postgres_container\" 2>/dev/null)",
              "  [[ -n \"$volume_name\" ]] || return 1",
              "  docker volume inspect \"$volume_name\" \\",
              "    --format '{{.Name}}|{{.Mountpoint}}|{{.CreatedAt}}' 2>/dev/null",
              "}",
              "",
              "volume_description=$(get_volume_description \"$ROOT_DIR\") || {",
              "  write_state FAILED_PRECHECK \"volume_missing\"",
              "  echo \"Volume PostgreSQL da instalação não encontrado.\" >&2",
              "  exit 1",
              "}",
              "VOLUME_FINGERPRINT=$(printf '%s' \"$volume_description\" | sha256sum | awk '{print $1}')",
          ]
          lines[compose_end + 1 : compose_end + 1] = dynamic_block

          rollback_start = lines.index(
              "      rollback_volume_description=$(docker volume inspect meufinanceiro_postgres_data \\" 
          )
          del lines[rollback_start : rollback_start + 2]
          lines.insert(
              rollback_start,
              "      rollback_volume_description=$(get_volume_description \"$ROOT_DIR\" || true)",
          )

          applied_start = lines.index(
              "if ! current_volume_description=$(docker volume inspect meufinanceiro_postgres_data \\" 
          )
          del lines[applied_start : applied_start + 2]
          lines.insert(
              applied_start,
              "if ! current_volume_description=$(get_volume_description \"$TARGET_WORKTREE\"); then",
          )
          shell_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          powershell_path = Path("infra/scripts/update-foundation.ps1")
          ps_lines = powershell_path.read_text(encoding="utf-8").splitlines()
          ps_start = ps_lines.index("function Get-VolumeFingerprint {")
          ps_end = ps_lines.index("if (-not $AcknowledgeSensitive) {")
          replacement = [
              "function Get-VolumeFingerprint([string]$ProjectDirectory) {",
              "    $containerId = Invoke-Compose $ProjectDirectory @(\"ps\", \"-q\", \"postgres\") -Capture",
              "    if ([string]::IsNullOrWhiteSpace($containerId)) {",
              "        throw \"Container PostgreSQL da instalação não encontrado.\"",
              "    }",
              "    $volumeName = Invoke-Native -Command \"docker\" -Arguments @(",
              "        \"inspect\", \"--format\",",
              "        '{{range .Mounts}}{{if eq .Destination \"/var/lib/postgresql/data\"}}{{.Name}}{{end}}{{end}}',",
              "        $containerId",
              "    ) -Capture",
              "    if ([string]::IsNullOrWhiteSpace($volumeName)) {",
              "        throw \"Volume PostgreSQL da instalação não encontrado.\"",
              "    }",
              "    $description = Invoke-Native -Command \"docker\" -Arguments @(",
              "        \"volume\", \"inspect\", $volumeName,",
              "        \"--format\", \"{{.Name}}|{{.Mountpoint}}|{{.CreatedAt}}\"",
              "    ) -Capture",
              "    $bytes = [Text.Encoding]::UTF8.GetBytes($description)",
              "    $sha = [Security.Cryptography.SHA256]::Create()",
              "    try {",
              "        return -join ($sha.ComputeHash($bytes) | ForEach-Object { $_.ToString(\"x2\") })",
              "    }",
              "    finally { $sha.Dispose() }",
              "}",
              "",
          ]
          ps_lines[ps_start:ps_end] = replacement
          ps_text = "\n".join(ps_lines) + "\n"
          ps_text = ps_text.replace(
              "(Get-VolumeFingerprint) -ne $VolumeFingerprint",
              "(Get-VolumeFingerprint $RootDir) -ne $VolumeFingerprint",
              1,
          )
          ps_text = ps_text.replace(
              "try { $VolumeFingerprint = Get-VolumeFingerprint }",
              "try { $VolumeFingerprint = Get-VolumeFingerprint $RootDir }",
              1,
          )
          ps_text = ps_text.replace(
              "(Get-VolumeFingerprint) -ne $VolumeFingerprint",
              "(Get-VolumeFingerprint $TargetWorktree) -ne $VolumeFingerprint",
              1,
          )
          powershell_path.write_text(ps_text, encoding="utf-8")

          workflow_path = Path(".github/workflows/safe-update-quality.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          marker = "          COMPOSE_PROJECT_NAME=meufinanceiro-update-ci\n"
          if marker not in workflow:
              anchor = "          APP_HTTP_PORT=8080\n"
              if workflow.count(anchor) != 1:
                  raise RuntimeError("COMPOSE_PROJECT_NAME anchor missing")
              workflow = workflow.replace(anchor, anchor + marker, 1)
          workflow_path.write_text(workflow, encoding="utf-8")
          PY
          bash -n infra/scripts/update-foundation.sh

      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Vinicius Eduardo Dezem"
          git config user.email "vinicius@zemsoft.com.br"
          git add \
            infra/scripts/update-foundation.sh \
            infra/scripts/update-foundation.ps1 \
            .github/workflows/safe-update-quality.yml
          git commit -m "fix(update): discover the active PostgreSQL volume" \
            -m "Signed-off-by: Vinicius Eduardo Dezem <vinicius@zemsoft.com.br>"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
