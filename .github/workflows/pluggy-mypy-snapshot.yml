name: Pluggy Mypy Snapshot

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize
    paths:
      - tools/pluggy-spike/pluggy_spike.py
      - .github/workflows/pluggy-mypy-snapshot.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply strict bytes return
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/pluggy-spike/pluggy_spike.py')
          text = path.read_text(encoding='utf-8')
          old = '        return response.read()\n'
          new = '        return bytes(response.read())\n'
          if text.count(old) != 1:
              raise SystemExit('expected transport return not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Install exact tools
        run: python -m pip install --disable-pip-version-check mypy==2.3.0 ruff==0.15.22

      - name: Validate corrected source
        run: |
          python -m ruff check tools/pluggy-spike/pluggy_spike.py
          python -m ruff format tools/pluggy-spike/pluggy_spike.py
          python -m mypy --strict tools/pluggy-spike/pluggy_spike.py

      - name: Commit correction and remove temporary workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/pluggy-mypy-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/pluggy-spike/pluggy_spike.py \
            .github/workflows/pluggy-mypy-snapshot.yml
          git commit --signoff -m 'fix(pluggy): make transport return explicitly typed'
          git push origin "HEAD:$HEAD_BRANCH"
