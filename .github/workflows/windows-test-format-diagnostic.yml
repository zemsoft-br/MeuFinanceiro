name: Windows Test Format Diagnostic

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - tests/quality/test_windows_dev_up_contract.py
      - .github/workflows/windows-test-format-diagnostic.yml

permissions:
  contents: read

jobs:
  format:
    if: github.event.pull_request.head.ref == 'feature/foundation-backup-restore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.14'

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.22

      - name: Format test
        run: python -m ruff format tests/quality/test_windows_dev_up_contract.py

      - name: Upload formatted test
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-format-${{ github.run_id }}
          path: tests/quality/test_windows_dev_up_contract.py
          retention-days: 1
          if-no-files-found: error
