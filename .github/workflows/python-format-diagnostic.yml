name: Python Format Diagnostic

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - infra/scripts/backup-contract.py
      - tests/quality/test_backup_contract.py
      - .github/workflows/python-format-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: python-format-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: Capture Ruff formatting
    if: github.event.pull_request.head.ref == 'feature/foundation-backup-restore'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13.14'

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.22

      - name: Format changed Python files
        run: |
          python -m ruff format \
            infra/scripts/backup-contract.py \
            tests/quality/test_backup_contract.py
          git diff -- \
            infra/scripts/backup-contract.py \
            tests/quality/test_backup_contract.py \
            > "$RUNNER_TEMP/python-format.patch"

      - name: Upload formatting result
        uses: actions/upload-artifact@v4
        with:
          name: python-format-${{ github.run_id }}
          path: |
            infra/scripts/backup-contract.py
            tests/quality/test_backup_contract.py
            ${{ runner.temp }}/python-format.patch
          retention-days: 3
          if-no-files-found: error
