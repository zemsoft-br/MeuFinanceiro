name: Quality

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ruff-format-bootstrap:
    name: Temporary Ruff baseline bootstrap
    if: github.event.pull_request.draft == false && github.head_ref == 'fix/quality-ruff-format-baseline-145'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check ruff==0.15.22

      - name: Lint before formatting
        run: >-
          python -m ruff check
          packages/finance packages/banking packages/banking-pluggy
          packages/banking-pluggy-execution packages/banking-sync
          packages/security packages/persistence apps/api apps/worker
          infra/scripts tests/quality tools/pluggy-spike

      - name: Format, verify allowlist, commit and push
        shell: bash
        run: |
          set -euo pipefail

          python -m ruff format \
            packages/finance packages/banking packages/banking-pluggy \
            packages/banking-pluggy-execution packages/banking-sync \
            packages/security packages/persistence apps/api apps/worker \
            infra/scripts tests/quality tools/pluggy-spike

          git diff --name-only --diff-filter=ACMRT -- '*.py' | sort > "$RUNNER_TEMP/actual.txt"

          if [[ ! -s "$RUNNER_TEMP/actual.txt" ]]; then
            echo "Ruff baseline is already formatted; no bootstrap commit required."
            exit 0
          fi

          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          apps/api/app/api/routes/banking_local_connections.py
          apps/api/app/main.py
          apps/api/app/services/banking_connections.py
          apps/api/tests/test_banking_connections_service.py
          apps/api/tests/test_banking_pluggy_runtime.py
          apps/api/tests/test_banking_reauthentication_routes.py
          packages/banking-pluggy-execution/src/meufinanceiro_banking_pluggy_execution/connect_token.py
          packages/banking-pluggy-execution/tests/test_reauthentication.py
          packages/banking-pluggy-execution/tests/test_registration.py
          packages/banking-pluggy/tests/test_connect_token.py
          packages/banking-pluggy/tests/test_reauthentication_connect_token.py
          packages/banking-sync/src/meufinanceiro_banking_sync/__init__.py
          packages/banking-sync/src/meufinanceiro_banking_sync/service.py
          packages/banking-sync/tests/test_post_sync_reconciliation.py
          packages/banking-sync/tests/test_service.py
          packages/finance/src/meufinanceiro_finance/access.py
          packages/finance/src/meufinanceiro_finance/accounts.py
          packages/finance/src/meufinanceiro_finance/money.py
          packages/finance/src/meufinanceiro_finance/movements.py
          packages/finance/tests/test_money.py
          packages/persistence/src/meufinanceiro_persistence/banking_fairness_models.py
          packages/persistence/src/meufinanceiro_persistence/banking_fairness_store.py
          packages/persistence/src/meufinanceiro_persistence/banking_observation_models.py
          packages/persistence/src/meufinanceiro_persistence/banking_observation_store.py
          packages/persistence/src/meufinanceiro_persistence/banking_reconciliation_store.py
          packages/persistence/src/meufinanceiro_persistence/banking_sync_store.py
          packages/persistence/src/meufinanceiro_persistence/financial_opening_balance_store.py
          packages/persistence/src/meufinanceiro_persistence/migrations/versions/0006_banking_residence_fk.py
          packages/persistence/src/meufinanceiro_persistence/migrations/versions/0011_financial_accounts.py
          packages/persistence/src/meufinanceiro_persistence/migrations/versions/0013_account_opening_balances.py
          packages/persistence/tests/test_banking_manual_sync_persistence.py
          packages/persistence/tests/test_banking_residence_fk_migration.py
          packages/persistence/tests/test_banking_sync_fairness_persistence.py
          packages/persistence/tests/test_banking_transaction_observations.py
          packages/persistence/tests/test_banking_transaction_reconciliation.py
          packages/persistence/tests/test_financial_accounts.py
          packages/persistence/tests/test_financial_opening_balances.py
          tests/quality/test_banking_canonical_residence_contract.py
          tests/quality/test_banking_manual_sync_persistence_contract.py
          tests/quality/test_banking_manual_sync_reconciliation_contract.py
          tests/quality/test_banking_transaction_observations_contract.py
          tests/quality/test_banking_transaction_reconciliation_contract.py
          tests/quality/test_finance_access_scope_contract.py
          tests/quality/test_finance_id_contract.py
          tests/quality/test_finance_money_contract.py
          tests/quality/test_financial_account_persistence_contract.py
          tests/quality/test_financial_movement_contract.py
          tests/quality/test_financial_opening_balance_contract.py
          tests/quality/test_flutter_pluggy_connect_contract.py
          tests/quality/test_local_banking_connections_contract.py
          tests/quality/test_pluggy_connect_token_contract.py
          tests/quality/test_pluggy_connection_registration_contract.py
          tests/quality/test_pluggy_reauthentication_contract.py
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"

          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          test "$(wc -l < "$RUNNER_TEMP/actual.txt")" -eq 53

          mapfile -t formatted_files < "$RUNNER_TEMP/actual.txt"
          git add -- "${formatted_files[@]}"
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'style: normalize Python baseline with Ruff 0.15.22' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:fix/quality-ruff-format-baseline-145
