name: Quality

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mandatory quality gates
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres-test-password@127.0.0.1:5432/meufinanceiro_test
      TEST_APP_DATABASE_USER: postgres
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: meufinanceiro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meufinanceiro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            packages/security/pyproject.toml
            packages/persistence/pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
            infra/scripts/run-quality.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'apps/web/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/meufinanceiro/flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.flutter-version', '.flutter-revision') }}

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(tr -d '[:space:]' < .flutter-version)"
          EXPECTED_REVISION="$(tr -d '[:space:]' < .flutter-revision)"
          FLUTTER_ROOT="$HOME/.cache/meufinanceiro/flutter/$EXPECTED_VERSION-$EXPECTED_REVISION"

          if [[ -x "$FLUTTER_ROOT/bin/flutter" ]]; then
            ACTUAL_REVISION="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
            if [[ "$ACTUAL_REVISION" != "$EXPECTED_REVISION" ]]; then
              rm -rf "$FLUTTER_ROOT"
            fi
          fi

          if [[ ! -x "$FLUTTER_ROOT/bin/flutter" ]]; then
            mkdir -p "$(dirname "$FLUTTER_ROOT")"
            git clone --depth 1 --branch "$EXPECTED_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi

          ACTUAL_REVISION="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          if [[ "$ACTUAL_REVISION" != "$EXPECTED_REVISION" ]]; then
            echo "Flutter revision mismatch after clone: expected $EXPECTED_REVISION, found $ACTUAL_REVISION" >&2
            exit 1
          fi

          git config --global --add safe.directory "$FLUTTER_ROOT"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" config --no-analytics
          "$FLUTTER_ROOT/bin/flutter" precache --web

      - name: Cache Dart and Flutter packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Validate DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          python infra/scripts/check-dco.py "$BASE_SHA" "$HEAD_SHA"

      - name: Require frontend lockfiles
        run: |
          test -f apps/web/package-lock.json
          test -f apps/app/pubspec.lock

      - name: Validate repository safety
        run: python infra/scripts/check-repository-safety.py

      - name: Install Python quality environment
        run: |
          python -m venv .quality-venv
          .quality-venv/bin/python -m pip install --disable-pip-version-check \
            mypy==2.3.0 \
            pip-audit==2.10.1 \
            ruff==0.15.22 \
            -e './packages/security[test]' \
            -e './packages/persistence[test]' \
            -e './apps/api[test]' \
            -e './apps/worker[test]'

      - name: Lint Python
        run: >-
          .quality-venv/bin/python -m ruff check
          packages/security packages/persistence apps/api apps/worker infra/scripts tests/quality

      - name: Check Python formatting
        run: >-
          .quality-venv/bin/python -m ruff format --check
          packages/security packages/persistence apps/api apps/worker infra/scripts tests/quality

      - name: Type-check Python
        run: >-
          .quality-venv/bin/python -m mypy --strict
          packages/security/src packages/persistence/src apps/api/app apps/worker/worker

      - name: Test Python
        run: >-
          .quality-venv/bin/python -m pytest
          packages/security/tests packages/persistence/tests apps/api/tests apps/worker/tests tests/quality

      - name: Check Python licenses
        run: .quality-venv/bin/python infra/scripts/check-python-licenses.py

      - name: Audit Python dependencies
        run: .quality-venv/bin/python -m pip_audit --local

      - name: Install React dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund

      - name: Lint React frontend
        working-directory: apps/web
        run: npm run lint

      - name: Type-check React frontend
        working-directory: apps/web
        run: npm run typecheck

      - name: Test React frontend
        working-directory: apps/web
        run: npm test

      - name: Build React frontend
        working-directory: apps/web
        run: npm run build

      - name: Audit React dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Check React licenses
        run: node infra/scripts/check-node-licenses.mjs apps/web

      - name: Validate Flutter toolchain
        run: python infra/scripts/check-flutter-toolchain.py

      - name: Resolve Flutter dependencies from lockfile
        working-directory: apps/app
        run: flutter pub get --enforce-lockfile

      - name: Check Flutter direct dependency licenses
        run: python infra/scripts/check-flutter-licenses.py

      - name: Check Dart formatting
        working-directory: apps/app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter client
        working-directory: apps/app
        run: flutter analyze

      - name: Test Flutter client
        working-directory: apps/app
        run: flutter test

      - name: Build Flutter Web client
        working-directory: apps/app
        run: flutter build web --release
