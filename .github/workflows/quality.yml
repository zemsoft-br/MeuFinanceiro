name: Temporary PowerShell Null Capture Fix

on:
  pull_request:
    branches:
      - develop
    types:
      - synchronize
      - ready_for_review

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 4

      - name: Patch null-safe PowerShell capture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("infra/scripts/update-foundation.ps1"): {
                  "$message = [string]::Concat($stderrText).Trim()":
                      "$message = ([string]$stderrText).Trim()",
                  "if ($Capture) { return [string]::Concat($stdoutText).Trim() }":
                      "if ($Capture) { return ([string]$stdoutText).Trim() }",
              },
              Path("infra/scripts/backup-create.ps1"): {
                  "$stderrText = [string]::Concat($stderrText).Trim()":
                      "$stderrText = ([string]$stderrText).Trim()",
                  "$stdoutText = [string]::Concat($stdoutText).Trim()":
                      "$stdoutText = ([string]$stdoutText).Trim()",
              },
              Path("infra/scripts/backup-verify.ps1"): {
                  "$stderrText = [string]::Concat($stderrText).Trim()":
                      "$stderrText = ([string]$stderrText).Trim()",
                  "$stdoutText = [string]::Concat($stdoutText).Trim()":
                      "$stdoutText = ([string]$stdoutText).Trim()",
              },
          }

          for path, mapping in replacements.items():
              text = path.read_text(encoding="utf-8")
              for old, new in mapping.items():
                  if text.count(old) != 1:
                      raise RuntimeError(
                          f"{path}: expected one occurrence of {old!r}, "
                          f"found {text.count(old)}"
                      )
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8", newline="\n")

          test_path = Path("tests/quality/test_safe_update_contract.py")
          text = test_path.read_text(encoding="utf-8")
          constants_anchor = 'UPDATE_PS1 = ROOT / "infra/scripts/update-foundation.ps1"\n'
          constants = (
              constants_anchor
              + 'BACKUP_CREATE_PS1 = ROOT / "infra/scripts/backup-create.ps1"\n'
              + 'BACKUP_VERIFY_PS1 = ROOT / "infra/scripts/backup-verify.ps1"\n'
          )
          if text.count(constants_anchor) != 1:
              raise RuntimeError("PowerShell constants anchor not found exactly once")
          text = text.replace(constants_anchor, constants)

          test_anchor = "\ndef test_update_operators_require_fast_forward_and_clean_checkout() -> None:\n"
          test_block = '''

def test_powershell_native_capture_is_null_safe() -> None:
    for path in (UPDATE_PS1, BACKUP_CREATE_PS1, BACKUP_VERIFY_PS1):
        content = read(path)
        assert "[string]::Concat(" not in content
        assert "([string]$stderrText).Trim()" in content
        assert "([string]$stdoutText).Trim()" in content


def test_update_operators_require_fast_forward_and_clean_checkout() -> None:
'''
          if text.count(test_anchor) != 1:
              raise RuntimeError("PowerShell null-safe test anchor not found exactly once")
          text = text.replace(test_anchor, test_block)
          test_path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Restore workflows and publish correction
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^^:.github/workflows/quality.yml > .github/workflows/quality.yml
          git show HEAD^^^:.github/workflows/safe-update-quality.yml > .github/workflows/safe-update-quality.yml
          git config user.name "Vinicius Eduardo Dezem"
          git config user.email "vinicius@zemsoft.com.br"
          git add \
            .github/workflows/quality.yml \
            .github/workflows/safe-update-quality.yml \
            infra/scripts/update-foundation.ps1 \
            infra/scripts/backup-create.ps1 \
            infra/scripts/backup-verify.ps1 \
            tests/quality/test_safe_update_contract.py
          git diff --cached --check
          git commit -m "fix(update): handle empty native output on PowerShell" \
            -m "Signed-off-by: Vinicius Eduardo Dezem <vinicius@zemsoft.com.br>"
          git push origin HEAD:feature/foundation-safe-update
