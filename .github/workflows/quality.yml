name: Quality

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: static-contract-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Static contract correction probe
    if: github.head_ref == 'fix/quality-static-contracts-155'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres-test-password@127.0.0.1:5432/meufinanceiro_test
      TEST_APP_DATABASE_USER: postgres
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: meufinanceiro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meufinanceiro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            packages/finance/pyproject.toml
            packages/banking/pyproject.toml
            packages/banking-pluggy/pyproject.toml
            packages/banking-pluggy-execution/pyproject.toml
            packages/banking-sync/pyproject.toml
            packages/security/pyproject.toml
            packages/persistence/pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml

      - name: Install canonical Python quality environment
        run: |
          python -m venv .quality-venv
          .quality-venv/bin/python -m pip install --disable-pip-version-check \
            mypy==2.3.0 \
            ruff==0.15.22 \
            -e './packages/finance[test]' \
            -e './packages/banking[test]' \
            -e './packages/banking-pluggy[test]' \
            -e './packages/banking-pluggy-execution[test]' \
            -e './packages/banking-sync[test]' \
            -e './packages/security[test]' \
            -e './packages/persistence[test]' \
            -e './apps/api[test]' \
            -e './apps/worker[test]'

      - name: Update stale static contracts
        shell: bash
        run: |
          set -euo pipefail
          .quality-venv/bin/python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'marker not found: {path}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'apps/api/tests/test_banking_local_connections_routes.py',
              '    assert "requestBody" not in operation\n    assert operation.get("parameters", []) == []\n',
              '    assert "requestBody" not in operation\n'
              '    parameters = {(item["name"], item["in"]) for item in operation.get("parameters", [])}\n'
              '    assert parameters == {("Authorization", "header")}\n',
          )

          replace(
              'apps/api/tests/test_banking_reauthentication_routes.py',
              '    assert "requestBody" not in operation\n'
              '    assert [parameter["name"] for parameter in operation["parameters"]] == [\n'
              '        "connection_id"\n'
              '    ]\n'
              '    assert operation["parameters"][0]["in"] == "path"\n',
              '    assert "requestBody" not in operation\n'
              '    parameters = {(item["name"], item["in"]) for item in operation["parameters"]}\n'
              '    assert parameters == {\n'
              '        ("connection_id", "path"),\n'
              '        ("Authorization", "header"),\n'
              '    }\n',
          )

          replace(
              'tests/quality/test_banking_manual_sync_persistence_contract.py',
              '    for table in ("sync_runs", "external_accounts", "sync_cursors"):\n'
              '        assert f"integrations.{table}" in MIGRATION\n'
              '        assert (\n'
              '            f"ALTER TABLE integrations.{table} ENABLE ROW LEVEL SECURITY" in MIGRATION\n'
              '        )\n'
              '        assert f"ALTER TABLE integrations.{table} FORCE ROW LEVEL SECURITY" in MIGRATION\n'
              '        assert f"CREATE POLICY {table}_residence_isolation" in MIGRATION\n',
              '    for table in ("sync_runs", "external_accounts", "sync_cursors"):\n'
              '        assert f"integrations.{table}" in MIGRATION\n'
              '    assert \'for table_name in ("sync_runs", "external_accounts", "sync_cursors"):\' in MIGRATION\n'
              '    assert "ENABLE ROW LEVEL SECURITY" in MIGRATION\n'
              '    assert "FORCE ROW LEVEL SECURITY" in MIGRATION\n'
              '    assert "{table_name}_residence_isolation" in MIGRATION\n',
          )
          replace(
              'tests/quality/test_banking_manual_sync_persistence_contract.py',
              '    assert "class BankingIntegrationStore(BankingManualSyncStoreMixin" in PUBLIC\n',
              '    class_bases = PUBLIC.split("class BankingIntegrationStore(", maxsplit=1)[1].split(\n'
              '        "):", maxsplit=1\n'
              '    )[0]\n'
              '    assert "BankingManualSyncStoreMixin" in class_bases\n',
          )

          replace(
              'tests/quality/test_finance_access_scope_contract.py',
              '    assert "papel administrativo não concede bypass" in INVARIANTS\n',
              '    lowered = INVARIANTS.lower()\n'
              '    assert "administrator" in lowered\n'
              '    assert "bypass" in lowered\n'
              '    assert "personal" in lowered\n',
          )

          replace(
              'tests/quality/test_financial_account_persistence_contract.py',
              '    assert "m.status = \'active\'" in insert_policy\n',
              '    assert "account_membership" in insert_policy\n'
              '    assert "m.status = \'active\'" in MIGRATION\n',
          )

          replace(
              'tests/quality/test_financial_movement_contract.py',
              '    assert "effective_date must be date" in MOVEMENTS\n'
              '    assert "competence_date must be date" in MOVEMENTS\n',
              '    assert \'_require_plain_date(self.effective_date, "effective_date")\' in MOVEMENTS\n'
              '    assert \'_require_plain_date(self.competence_date, "competence_date")\' in MOVEMENTS\n',
          )
          replace(
              'tests/quality/test_financial_movement_contract.py',
              '    assert "herda a audiência da conta" in ADR\n',
              '    assert "Audiência herdada da conta" in ADR\n'
              '    assert "Sua audiência é a audiência da conta financeira" in ADR\n',
          )

          replace(
              'tests/quality/test_pluggy_connect_token_contract.py',
              'def test_connect_token_payload_is_server_scoped_and_minimal() -> None:\n'
              '    assert \'"clientUserId": normalized_client_user_id\' in TRANSPORT_SOURCE\n'
              '    assert \'"avoidDuplicates": True\' in TRANSPORT_SOURCE\n'
              '    for forbidden in (\n'
              '        \'"itemId"\',\n'
              '        \'"webhookUrl"\',\n'
              '        \'"oauthRedirectUri"\',\n'
              '        \'"connectorId"\',\n'
              '        \'"products"\',\n'
              '    ):\n'
              '        assert forbidden not in TRANSPORT_SOURCE\n',
              'def test_connect_token_payload_is_server_scoped_and_minimal() -> None:\n'
              '    create_method = TRANSPORT_SOURCE.split("def create_connect_token", maxsplit=1)[1].split(\n'
              '        "def create_update_connect_token", maxsplit=1\n'
              '    )[0]\n'
              '    assert \'"clientUserId": normalized_client_user_id\' in create_method\n'
              '    assert \'"avoidDuplicates": True\' in create_method\n'
              '    for forbidden in (\n'
              '        \'"itemId"\',\n'
              '        \'"webhookUrl"\',\n'
              '        \'"oauthRedirectUri"\',\n'
              '        \'"connectorId"\',\n'
              '        \'"products"\',\n'
              '    ):\n'
              '        assert forbidden not in create_method\n'
              '    update_method = TRANSPORT_SOURCE.split("def create_update_connect_token", maxsplit=1)[1].split(\n'
              '        "def _create_connect_token", maxsplit=1\n'
              '    )[0]\n'
              '    assert \'"itemId": normalized_item_id\' in update_method\n',
          )

          replace(
              'tests/quality/test_pluggy_readonly_adapter_contract.py',
              'BOUNDARY_SOURCE_TEXT = "\\n".join(\n'
              '    (SOURCE_ROOT / name).read_text(encoding="utf-8")\n'
              '    for name in ("__init__.py", "adapter.py", "gateway.py")\n'
              ')\n',
              'BOUNDARY_SOURCE_TEXT = "\\n".join(\n'
              '    (SOURCE_ROOT / name).read_text(encoding="utf-8")\n'
              '    for name in ("adapter.py", "gateway.py")\n'
              ')\n',
          )
          PY

      - name: Format changed tests
        run: >-
          .quality-venv/bin/python -m ruff format
          apps/api/tests/test_banking_local_connections_routes.py
          apps/api/tests/test_banking_reauthentication_routes.py
          tests/quality/test_banking_manual_sync_persistence_contract.py
          tests/quality/test_finance_access_scope_contract.py
          tests/quality/test_financial_account_persistence_contract.py
          tests/quality/test_financial_movement_contract.py
          tests/quality/test_pluggy_connect_token_contract.py
          tests/quality/test_pluggy_readonly_adapter_contract.py

      - name: Enforce tests-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          apps/api/tests/test_banking_local_connections_routes.py
          apps/api/tests/test_banking_reauthentication_routes.py
          tests/quality/test_banking_manual_sync_persistence_contract.py
          tests/quality/test_finance_access_scope_contract.py
          tests/quality/test_financial_account_persistence_contract.py
          tests/quality/test_financial_movement_contract.py
          tests/quality/test_pluggy_connect_token_contract.py
          tests/quality/test_pluggy_readonly_adapter_contract.py
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git diff --check

      - name: Lint Python
        run: >-
          .quality-venv/bin/python -m ruff check
          packages/finance packages/banking packages/banking-pluggy
          packages/banking-pluggy-execution packages/banking-sync
          packages/security packages/persistence apps/api apps/worker
          infra/scripts tests/quality tools/pluggy-spike

      - name: Check Python formatting
        run: >-
          .quality-venv/bin/python -m ruff format --check
          packages/finance packages/banking packages/banking-pluggy
          packages/banking-pluggy-execution packages/banking-sync
          packages/security packages/persistence apps/api apps/worker
          infra/scripts tests/quality tools/pluggy-spike

      - name: Type-check Python
        run: >-
          .quality-venv/bin/python -m mypy --strict
          packages/finance/src packages/banking/src packages/banking-pluggy/src
          packages/banking-pluggy-execution/src packages/banking-sync/src
          packages/security/src packages/persistence/src apps/api/app apps/worker/worker
          tools/pluggy-spike/pluggy_spike.py

      - name: Test Python
        run: >-
          .quality-venv/bin/python -m pytest
          packages/finance/tests packages/banking/tests
          packages/banking-pluggy/tests packages/banking-pluggy-execution/tests
          packages/banking-sync/tests packages/security/tests
          packages/persistence/tests apps/api/tests apps/worker/tests tests/quality

      - name: Commit successful test corrections
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/api/tests/test_banking_local_connections_routes.py \
            apps/api/tests/test_banking_reauthentication_routes.py \
            tests/quality/test_banking_manual_sync_persistence_contract.py \
            tests/quality/test_finance_access_scope_contract.py \
            tests/quality/test_financial_account_persistence_contract.py \
            tests/quality/test_financial_movement_contract.py \
            tests/quality/test_pluggy_connect_token_contract.py \
            tests/quality/test_pluggy_readonly_adapter_contract.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'test(quality): align static contracts with current invariants' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:fix/quality-static-contracts-155
