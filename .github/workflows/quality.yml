name: Quality

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  riverpod-notifier-probe:
    name: Temporary Riverpod 3 notifier probe
    if: github.head_ref == 'fix/quality-flutter-riverpod-149'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Cache Flutter SDK
        uses: actions/cache@v5
        with:
          path: ~/.cache/meufinanceiro/flutter
          key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.flutter-version', '.flutter-revision') }}

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(tr -d '[:space:]' < .flutter-version)"
          EXPECTED_REVISION="$(tr -d '[:space:]' < .flutter-revision)"
          FLUTTER_ROOT="$HOME/.cache/meufinanceiro/flutter/$EXPECTED_VERSION-$EXPECTED_REVISION"

          if [[ -x "$FLUTTER_ROOT/bin/flutter" ]]; then
            ACTUAL_REVISION="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
            if [[ "$ACTUAL_REVISION" != "$EXPECTED_REVISION" ]]; then
              rm -rf "$FLUTTER_ROOT"
            fi
          fi

          if [[ ! -x "$FLUTTER_ROOT/bin/flutter" ]]; then
            mkdir -p "$(dirname "$FLUTTER_ROOT")"
            git clone --depth 1 --branch "$EXPECTED_VERSION" \
              https://github.com/flutter/flutter.git "$FLUTTER_ROOT"
          fi

          ACTUAL_REVISION="$(git -C "$FLUTTER_ROOT" rev-parse HEAD)"
          if [[ "$ACTUAL_REVISION" != "$EXPECTED_REVISION" ]]; then
            echo "Flutter revision mismatch after clone: expected $EXPECTED_REVISION, found $ACTUAL_REVISION" >&2
            exit 1
          fi

          git config --global --add safe.directory "$FLUTTER_ROOT"
          echo "$FLUTTER_ROOT/bin" >> "$GITHUB_PATH"
          "$FLUTTER_ROOT/bin/flutter" config --no-analytics
          "$FLUTTER_ROOT/bin/flutter" precache --web

      - name: Cache Dart and Flutter packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('apps/app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Apply minimal Riverpod 3 migration candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = (
              Path('apps/app/lib/features/banking/connections/banking_connections_controller.dart'),
              Path('apps/app/lib/features/banking/pluggy/connect/pluggy_connect_controller.dart'),
              Path('apps/app/lib/features/banking/pluggy/reauthentication/pluggy_reauthentication_controller.dart'),
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if 'AutoDisposeNotifier<' in text:
                  text = text.replace('AutoDisposeNotifier<', 'Notifier<')
                  path.write_text(text, encoding='utf-8')
              elif 'extends Notifier<' not in text:
                  raise SystemExit(f'Notifier migration marker not found in {path}')
          PY

      - name: Resolve Flutter dependencies from lockfile
        working-directory: apps/app
        run: flutter pub get --enforce-lockfile

      - name: Format Flutter client
        working-directory: apps/app
        run: dart format lib test

      - name: Check Dart formatting
        working-directory: apps/app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Flutter client
        working-directory: apps/app
        run: flutter analyze

      - name: Test Flutter client
        working-directory: apps/app
        run: flutter test

      - name: Build Flutter Web client
        working-directory: apps/app
        run: >-
          flutter build web --release --no-web-resources-cdn
          --pwa-strategy=none

      - name: Commit successful migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            apps/app/lib/features/banking/connections/banking_connections_controller.dart \
            apps/app/lib/features/banking/pluggy/connect/pluggy_connect_controller.dart \
            apps/app/lib/features/banking/pluggy/reauthentication/pluggy_reauthentication_controller.dart
          if git diff --cached --quiet; then
            echo 'Riverpod migration is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'fix(flutter): migrate auto-dispose notifiers to Riverpod 3' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:fix/quality-flutter-riverpod-149
