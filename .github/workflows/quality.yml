name: Quality

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mandatory quality gates
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            packages/security/pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
            infra/scripts/run-quality.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'apps/web/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Validate DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          python infra/scripts/check-dco.py "$BASE_SHA" "$HEAD_SHA"

      - name: Require frontend lockfile
        run: test -f apps/web/package-lock.json

      - name: Validate repository safety
        run: python infra/scripts/check-repository-safety.py

      - name: Install Python quality environment
        run: |
          python -m venv .quality-venv
          .quality-venv/bin/python -m pip install --disable-pip-version-check \
            mypy==2.3.0 \
            pip-audit==2.10.1 \
            ruff==0.15.22 \
            -e './packages/security[test]' \
            -e './apps/api[test]' \
            -e ./apps/worker

      - name: Apply canonical Python formatting
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          .quality-venv/bin/python -m ruff format packages/security apps/api apps/worker infra/scripts tests/quality
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/security apps/api apps/worker infra/scripts tests/quality
          git commit --signoff -m "style: format security foundation"
          git push origin "HEAD:$HEAD_BRANCH"
          echo "Formatting commit created; permanent read-only workflow will be restored next."
          exit 1
