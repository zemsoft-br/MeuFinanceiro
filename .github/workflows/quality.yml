name: Quality

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mypy-baseline-probe:
    name: Temporary strict mypy baseline probe
    if: github.head_ref == 'fix/quality-mypy-baseline-147'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            packages/finance/pyproject.toml
            packages/banking/pyproject.toml
            packages/banking-pluggy/pyproject.toml
            packages/banking-pluggy-execution/pyproject.toml
            packages/banking-sync/pyproject.toml
            packages/security/pyproject.toml
            packages/persistence/pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml

      - name: Install canonical Python quality environment
        run: |
          python -m venv .quality-venv
          .quality-venv/bin/python -m pip install --disable-pip-version-check \
            mypy==2.3.0 \
            ruff==0.15.22 \
            -e './packages/finance[test]' \
            -e './packages/banking[test]' \
            -e './packages/banking-pluggy[test]' \
            -e './packages/banking-pluggy-execution[test]' \
            -e './packages/banking-sync[test]' \
            -e './packages/security[test]' \
            -e './packages/persistence[test]' \
            -e './apps/api[test]' \
            -e './apps/worker[test]'

      - name: Apply typed banking metadata facade candidate
        shell: bash
        run: |
          set -euo pipefail
          .quality-venv/bin/python - <<'PY'
          from pathlib import Path

          package = Path('packages/persistence/src/meufinanceiro_persistence')
          facade = package / 'banking_sync_schema.py'
          facade.write_text(
              '''"""Typed access to banking sync tables registered in shared metadata."""\n\n'
              'from __future__ import annotations\n\n'
              'from sqlalchemy import Table\n\n'
              'from meufinanceiro_persistence.schema import metadata\n\n\n'
              'def _registered_table(qualified_name: str) -> Table:\n'
              '    table = metadata.tables.get(qualified_name)\n'
              '    if table is None:\n'
              '        raise RuntimeError("required banking metadata table is not registered")\n'
              '    return table\n\n\n'
              'external_accounts = _registered_table("integrations.external_accounts")\n'
              'sync_cursors = _registered_table("integrations.sync_cursors")\n'
              'sync_runs = _registered_table("integrations.sync_runs")\n\n'
              '__all__ = ["external_accounts", "sync_cursors", "sync_runs"]\n''',
              encoding='utf-8',
          )

          replacements = {
              'banking_sync_store.py': (
                  'from meufinanceiro_persistence.schema import (\n'
                  '    connections,\n'
                  '    external_accounts,\n'
                  '    sync_cursors,\n'
                  '    sync_runs,\n'
                  ')\n',
                  'from meufinanceiro_persistence.banking_sync_schema import (\n'
                  '    external_accounts,\n'
                  '    sync_cursors,\n'
                  '    sync_runs,\n'
                  ')\n'
                  'from meufinanceiro_persistence.schema import connections\n',
              ),
              'banking_fairness_schema.py': (
                  'from meufinanceiro_persistence.schema import external_accounts, metadata\n',
                  'from meufinanceiro_persistence.banking_sync_schema import external_accounts\n'
                  'from meufinanceiro_persistence.schema import metadata\n',
              ),
              'banking_observation_store.py': (
                  'from meufinanceiro_persistence.schema import (\n'
                  '    connections,\n'
                  '    external_accounts,\n'
                  '    sync_cursors,\n'
                  ')\n',
                  'from meufinanceiro_persistence.banking_sync_schema import (\n'
                  '    external_accounts,\n'
                  '    sync_cursors,\n'
                  ')\n'
                  'from meufinanceiro_persistence.schema import connections\n',
              ),
              'banking_fairness_store.py': (
                  'from meufinanceiro_persistence.schema import (\n'
                  '    connections,\n'
                  '    external_accounts,\n'
                  '    sync_cursors,\n'
                  ')\n',
                  'from meufinanceiro_persistence.banking_sync_schema import (\n'
                  '    external_accounts,\n'
                  '    sync_cursors,\n'
                  ')\n'
                  'from meufinanceiro_persistence.schema import connections\n',
              ),
              'banking_reconciliation_store.py': (
                  'from meufinanceiro_persistence.schema import connections, external_accounts\n',
                  'from meufinanceiro_persistence.banking_sync_schema import external_accounts\n'
                  'from meufinanceiro_persistence.schema import connections\n',
              ),
          }

          for filename, (old, new) in replacements.items():
              path = package / filename
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'import marker not found in {filename}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          identity = package / 'identity_store.py'
          text = identity.read_text(encoding='utf-8')
          old = '        row: Mapping[str, Any] | None = (\n'
          new = '        row = (\n'
          if old not in text:
              raise SystemExit('identity row assignment marker not found')
          text = text.replace(old, new, 1)
          text = text.replace('from collections.abc import Mapping\n', '')
          text = text.replace('from typing import Any, NoReturn\n', 'from typing import NoReturn\n')
          identity.write_text(text, encoding='utf-8')
          PY

      - name: Format candidate files
        run: >-
          .quality-venv/bin/python -m ruff format
          packages/persistence/src/meufinanceiro_persistence/banking_sync_schema.py
          packages/persistence/src/meufinanceiro_persistence/banking_sync_store.py
          packages/persistence/src/meufinanceiro_persistence/banking_fairness_schema.py
          packages/persistence/src/meufinanceiro_persistence/banking_observation_store.py
          packages/persistence/src/meufinanceiro_persistence/banking_fairness_store.py
          packages/persistence/src/meufinanceiro_persistence/banking_reconciliation_store.py
          packages/persistence/src/meufinanceiro_persistence/identity_store.py
          packages/finance/src/meufinanceiro_finance/__init__.py

      - name: Lint Python
        run: >-
          .quality-venv/bin/python -m ruff check
          packages/finance packages/banking packages/banking-pluggy
          packages/banking-pluggy-execution packages/banking-sync
          packages/security packages/persistence apps/api apps/worker
          infra/scripts tests/quality tools/pluggy-spike

      - name: Check Python formatting
        run: >-
          .quality-venv/bin/python -m ruff format --check
          packages/finance packages/banking packages/banking-pluggy
          packages/banking-pluggy-execution packages/banking-sync
          packages/security packages/persistence apps/api apps/worker
          infra/scripts tests/quality tools/pluggy-spike

      - name: Smoke typed metadata facade
        run: |
          .quality-venv/bin/python - <<'PY'
          from meufinanceiro_persistence.banking_sync_schema import (
              external_accounts,
              sync_cursors,
              sync_runs,
          )
          assert external_accounts.fullname == 'integrations.external_accounts'
          assert sync_cursors.fullname == 'integrations.sync_cursors'
          assert sync_runs.fullname == 'integrations.sync_runs'
          PY

      - name: Type-check Python
        run: >-
          .quality-venv/bin/python -m mypy --strict
          packages/finance/src packages/banking/src packages/banking-pluggy/src
          packages/banking-pluggy-execution/src packages/banking-sync/src
          packages/security/src packages/persistence/src apps/api/app apps/worker/worker
          tools/pluggy-spike/pluggy_spike.py

      - name: Commit successful candidate fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add \
            packages/persistence/src/meufinanceiro_persistence/banking_sync_schema.py \
            packages/persistence/src/meufinanceiro_persistence/banking_sync_store.py \
            packages/persistence/src/meufinanceiro_persistence/banking_fairness_schema.py \
            packages/persistence/src/meufinanceiro_persistence/banking_observation_store.py \
            packages/persistence/src/meufinanceiro_persistence/banking_fairness_store.py \
            packages/persistence/src/meufinanceiro_persistence/banking_reconciliation_store.py \
            packages/persistence/src/meufinanceiro_persistence/identity_store.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'fix(persistence): add typed banking metadata facade' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:fix/quality-mypy-baseline-147
