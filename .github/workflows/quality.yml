name: Quality

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mandatory quality gates
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/worker/pyproject.toml
            infra/scripts/run-quality.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/web/package.json', 'apps/web/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Validate DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          python infra/scripts/check-dco.py "$BASE_SHA" "$HEAD_SHA"

      - name: Bootstrap missing frontend lockfile
        id: lockfile
        working-directory: apps/web
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload generated frontend lockfile
        if: steps.lockfile.outputs.generated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: web-package-lock
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated lockfile on trusted branch
        if: >-
          steps.lockfile.outputs.generated == 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit --signoff -m "chore: add frontend dependency lockfile"
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Require committed frontend lockfile
        if: steps.lockfile.outputs.generated == 'true'
        run: |
          echo "apps/web/package-lock.json was generated and committed for this trusted bootstrap."
          echo "The next run must use the committed lockfile with read-only permissions."
          exit 1

      - name: Run local-equivalent quality suite
        run: python infra/scripts/run-quality.py --recreate
