name: Quality

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: validation-python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python baseline with categories
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres-test-password@127.0.0.1:5432/meufinanceiro_test
      TEST_APP_DATABASE_USER: postgres
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: meufinanceiro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meufinanceiro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            packages/finance/pyproject.toml
            packages/banking/pyproject.toml
            packages/banking-pluggy/pyproject.toml
            packages/banking-pluggy-execution/pyproject.toml
            packages/banking-sync/pyproject.toml
            packages/security/pyproject.toml
            packages/persistence/pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml

      - name: Validate DCO sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          python infra/scripts/check-dco.py "$BASE_SHA" "$HEAD_SHA"

      - name: Validate repository safety
        run: python infra/scripts/check-repository-safety.py

      - name: Install Python quality environment
        run: |
          python -m venv .quality-venv
          .quality-venv/bin/python -m pip install --disable-pip-version-check \
            mypy==2.3.0 \
            ruff==0.15.22 \
            -e './packages/finance[test]' \
            -e './packages/banking[test]' \
            -e './packages/banking-pluggy[test]' \
            -e './packages/banking-pluggy-execution[test]' \
            -e './packages/banking-sync[test]' \
            -e './packages/security[test]' \
            -e './packages/persistence[test]' \
            -e './apps/api[test]' \
            -e './apps/worker[test]'

      - name: Normalize exact category files
        id: normalize_categories
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/finance/tests/test_categories.py
            packages/persistence/src/meufinanceiro_persistence/migrations/versions/0012_financial_categories.py
            packages/persistence/tests/test_financial_categories.py
          )
          .quality-venv/bin/python -m ruff format "${files[@]}"
          git diff --name-only --diff-filter=ACMRT -- '*.py' | sort > "$RUNNER_TEMP/actual.txt"
          if [[ -s "$RUNNER_TEMP/actual.txt" ]]; then
            printf '%s\n' "${files[@]}" | sort > "$RUNNER_TEMP/expected.txt"
            diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
            test "$(wc -l < "$RUNNER_TEMP/actual.txt")" -eq 3
            git add -- "${files[@]}"
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit \
              -m 'style(finance): normalize category files with Ruff 0.15.22' \
              -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
            git push origin HEAD:validation/python-baseline-with-categories
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Stop after normalization push
        if: steps.normalize_categories.outputs.pushed == 'true'
        run: echo 'New synchronize run will validate the formatted HEAD.'

      - name: Lint Python
        if: steps.normalize_categories.outputs.pushed != 'true'
        run: >-
          .quality-venv/bin/python -m ruff check
          packages/finance packages/banking packages/banking-pluggy
          packages/banking-pluggy-execution packages/banking-sync
          packages/security packages/persistence apps/api apps/worker
          infra/scripts tests/quality tools/pluggy-spike

      - name: Check Python formatting
        if: steps.normalize_categories.outputs.pushed != 'true'
        run: >-
          .quality-venv/bin/python -m ruff format --check
          packages/finance packages/banking packages/banking-pluggy
          packages/banking-pluggy-execution packages/banking-sync
          packages/security packages/persistence apps/api apps/worker
          infra/scripts tests/quality tools/pluggy-spike

      - name: Type-check Python
        if: steps.normalize_categories.outputs.pushed != 'true'
        run: >-
          .quality-venv/bin/python -m mypy --strict
          packages/finance/src packages/banking/src packages/banking-pluggy/src
          packages/banking-pluggy-execution/src packages/banking-sync/src
          packages/security/src packages/persistence/src apps/api/app apps/worker/worker
          tools/pluggy-spike/pluggy_spike.py

      - name: Test Python
        if: steps.normalize_categories.outputs.pushed != 'true'
        shell: bash
        run: >-
          .quality-venv/bin/python -m pytest
          packages/finance/tests packages/banking/tests
          packages/banking-pluggy/tests packages/banking-pluggy-execution/tests
          packages/banking-sync/tests packages/security/tests
          packages/persistence/tests apps/api/tests apps/worker/tests tests/quality
