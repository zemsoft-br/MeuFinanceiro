name: Quality

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: quality-correction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correct-postgres-mount:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Correct PostgreSQL mount discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path in (
              Path('infra/scripts/update-foundation.sh'),
              Path('infra/scripts/update-foundation.ps1'),
          ):
              text = path.read_text(encoding='utf-8')
              old = '/var/lib/postgresql/data'
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exactly one old mount, found {text.count(old)}')
              path.write_text(text.replace(old, '/var/lib/postgresql'), encoding='utf-8', newline='\n')

          test_path = Path('tests/quality/test_safe_update_contract.py')
          text = test_path.read_text(encoding='utf-8')
          old = '''        assert "/var/lib/postgresql/data" in content
        assert "VolumeFingerprint" in content or "VOLUME_FINGERPRINT" in content
'''
          new = '''        assert 'Destination "/var/lib/postgresql"' in content
        assert "/var/lib/postgresql/data" not in content
        assert "VolumeFingerprint" in content or "VOLUME_FINGERPRINT" in content
'''
          if text.count(old) != 1:
              raise RuntimeError('test contract anchor not found exactly once')
          test_path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
          PY

      - name: Restore workflows and publish correction
        shell: bash
        run: |
          set -euo pipefail
          mv .tmp/quality.yml.original .github/workflows/quality.yml
          mv .tmp/safe-update-quality.yml.original .github/workflows/safe-update-quality.yml
          rmdir .tmp
          git config user.name "Vinicius Eduardo Dezem"
          git config user.email "vinicius@zemsoft.com.br"
          git add .github/workflows/quality.yml .github/workflows/safe-update-quality.yml infra/scripts/update-foundation.sh infra/scripts/update-foundation.ps1 tests/quality/test_safe_update_contract.py
          git add -u .tmp
          git diff --cached --check
          git commit -m "fix(update): match PostgreSQL volume mount contract" \
            -m "Signed-off-by: Vinicius Eduardo Dezem <vinicius@zemsoft.com.br>"
          git push origin HEAD:feature/foundation-safe-update

# Triggered through the Contents API so the PR emits synchronize.
