name: Persistence Functional Baseline Probe

on:
  pull_request:
    branches:
      - fix/quality-static-contracts-155
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: persistence-functional-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Persistence functional baseline probe
    if: github.head_ref == 'fix/persistence-functional-baseline-157'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres-test-password@127.0.0.1:5432/meufinanceiro_test
      TEST_APP_DATABASE_USER: postgres
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: meufinanceiro_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meufinanceiro_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout exact stacked head
        uses: actions/checkout@v6
        with:
          ref: fix/persistence-functional-baseline-157
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            packages/finance/pyproject.toml
            packages/banking/pyproject.toml
            packages/banking-pluggy/pyproject.toml
            packages/banking-pluggy-execution/pyproject.toml
            packages/banking-sync/pyproject.toml
            packages/security/pyproject.toml
            packages/persistence/pyproject.toml
            apps/api/pyproject.toml
            apps/worker/pyproject.toml

      - name: Install canonical Python quality environment
        run: |
          python -m venv .quality-venv
          .quality-venv/bin/python -m pip install --disable-pip-version-check \
            mypy==2.3.0 \
            ruff==0.15.22 \
            -e './packages/finance[test]' \
            -e './packages/banking[test]' \
            -e './packages/banking-pluggy[test]' \
            -e './packages/banking-pluggy-execution[test]' \
            -e './packages/banking-sync[test]' \
            -e './packages/security[test]' \
            -e './packages/persistence[test]' \
            -e './apps/api[test]' \
            -e './apps/worker[test]'

      - name: Apply proven static contract corrections
        shell: bash
        run: |
          set -euo pipefail
          .quality-venv/bin/python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/quality.yml').read_text(encoding='utf-8')
          marker = '          from pathlib import Path\n'
          start = workflow.index(marker)
          end = workflow.index('          PY\n', start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<static-contract-corrections>', 'exec'))
          PY

      - name: Apply functional persistence fixes
        shell: bash
        run: |
          set -euo pipefail
          .quality-venv/bin/python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'marker not found: {path}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'packages/persistence/src/meufinanceiro_persistence/migrations/versions/0011_financial_accounts.py',
              '    op.execute(f"REVOKE USAGE ON SCHEMA finance FROM {role}")\n'
              '    op.execute("DROP TABLE finance.account_grants")\n',
              '    op.execute(f"REVOKE USAGE ON SCHEMA finance FROM {role}")\n'
              '    op.execute("DROP POLICY finance_accounts_select ON finance.accounts")\n'
              '    op.execute("DROP POLICY finance_accounts_insert ON finance.accounts")\n'
              '    op.execute("DROP POLICY finance_account_grants_select ON finance.account_grants")\n'
              '    op.execute("DROP TABLE finance.account_grants")\n',
          )

          observation_store = 'packages/persistence/src/meufinanceiro_persistence/banking_observation_store.py'
          replace(
              observation_store,
              '                    result = connection.execute(\n'
              '                        statement.on_conflict_do_update(\n',
              '                    applied_id = connection.scalar(\n'
              '                        statement.on_conflict_do_update(\n',
          )
          replace(
              observation_store,
              '                        )\n'
              '                    )\n'
              '                    if result.rowcount and result.rowcount > 0:\n'
              '                        records_applied += 1\n',
              '                        ).returning(external_observations.c.id)\n'
              '                    )\n'
              '                    if applied_id is not None:\n'
              '                        records_applied += 1\n',
          )

          replace(
              'packages/persistence/tests/test_financial_opening_balances.py',
              '            .values(status="ARCHIVED", archived_at=NOW, updated_at=NOW)\n',
              '            .values(\n'
              '                status="ARCHIVED",\n'
              '                archived_at=func.transaction_timestamp(),\n'
              '                updated_at=func.transaction_timestamp(),\n'
              '            )\n',
          )
          PY

      - name: Format candidate changes
        run: >-
          .quality-venv/bin/python -m ruff format
          apps/api/tests/test_banking_local_connections_routes.py
          apps/api/tests/test_banking_reauthentication_routes.py
          tests/quality/test_banking_manual_sync_persistence_contract.py
          tests/quality/test_finance_access_scope_contract.py
          tests/quality/test_financial_account_persistence_contract.py
          tests/quality/test_financial_movement_contract.py
          tests/quality/test_pluggy_connect_token_contract.py
          tests/quality/test_pluggy_readonly_adapter_contract.py
          packages/persistence/src/meufinanceiro_persistence/migrations/versions/0011_financial_accounts.py
          packages/persistence/src/meufinanceiro_persistence/banking_observation_store.py
          packages/persistence/tests/test_financial_opening_balances.py

      - name: Enforce exact candidate diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > "$RUNNER_TEMP/actual.txt"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          apps/api/tests/test_banking_local_connections_routes.py
          apps/api/tests/test_banking_reauthentication_routes.py
          packages/persistence/src/meufinanceiro_persistence/banking_observation_store.py
          packages/persistence/src/meufinanceiro_persistence/migrations/versions/0011_financial_accounts.py
          packages/persistence/tests/test_financial_opening_balances.py
          tests/quality/test_banking_manual_sync_persistence_contract.py
          tests/quality/test_finance_access_scope_contract.py
          tests/quality/test_financial_account_persistence_contract.py
          tests/quality/test_financial_movement_contract.py
          tests/quality/test_pluggy_connect_token_contract.py
          tests/quality/test_pluggy_readonly_adapter_contract.py
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/expected.txt"
          sort -o "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/expected.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"
          git diff --check

      - name: Lint Python
        run: >-
          .quality-venv/bin/python -m ruff check
          packages/finance packages/banking packages/banking-pluggy
          packages/banking-pluggy-execution packages/banking-sync
          packages/security packages/persistence apps/api apps/worker
          infra/scripts tests/quality tools/pluggy-spike

      - name: Check Python formatting
        run: >-
          .quality-venv/bin/python -m ruff format --check
          packages/finance packages/banking packages/banking-pluggy
          packages/banking-pluggy-execution packages/banking-sync
          packages/security packages/persistence apps/api apps/worker
          infra/scripts tests/quality tools/pluggy-spike

      - name: Type-check Python
        run: >-
          .quality-venv/bin/python -m mypy --strict
          packages/finance/src packages/banking/src packages/banking-pluggy/src
          packages/banking-pluggy-execution/src packages/banking-sync/src
          packages/security/src packages/persistence/src apps/api/app apps/worker/worker
          tools/pluggy-spike/pluggy_spike.py

      - name: Test Python
        run: >-
          .quality-venv/bin/python -m pytest
          packages/finance/tests packages/banking/tests
          packages/banking-pluggy/tests packages/banking-pluggy-execution/tests
          packages/banking-sync/tests packages/security/tests
          packages/persistence/tests apps/api/tests apps/worker/tests tests/quality

      - name: Materialize proven stacked commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          git show origin/develop:.github/workflows/quality.yml > .github/workflows/quality.yml
          git rm .github/workflows/probe-157.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            .github/workflows/quality.yml \
            apps/api/tests/test_banking_local_connections_routes.py \
            apps/api/tests/test_banking_reauthentication_routes.py \
            tests/quality/test_banking_manual_sync_persistence_contract.py \
            tests/quality/test_finance_access_scope_contract.py \
            tests/quality/test_financial_account_persistence_contract.py \
            tests/quality/test_financial_movement_contract.py \
            tests/quality/test_pluggy_connect_token_contract.py \
            tests/quality/test_pluggy_readonly_adapter_contract.py
          git commit \
            -m 'test(quality): align static contracts with current invariants' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:fix/quality-static-contracts-155

          git add \
            packages/persistence/src/meufinanceiro_persistence/migrations/versions/0011_financial_accounts.py \
            packages/persistence/src/meufinanceiro_persistence/banking_observation_store.py \
            packages/persistence/tests/test_financial_opening_balances.py
          git commit \
            -m 'fix(persistence): restore functional quality baseline' \
            -m 'Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          git push origin HEAD:fix/persistence-functional-baseline-157
